<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SofkaBankLogin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-from">
        <h1>Login SofkaBank</h1>
        <div class="container">
            <div class="main">
                <div class="content">
                    <h2>Inicio de sesión</h2>
                    <form action="" method="post">
                        <input type="text" placeholder="Usuario" name="username" required autofocus="">
                        <input type="password" placeholder="Contraseña" name="password" required autofocus="">
                        <button class="btn" type="submit">Iniciar sesión</button>
                    </form>
                    <p class="account">¿No tienes una cuenta? <a href="#">Registrate</a></p>
                </div>
                <div class="form img">
                    <img src="SofkaBank.png" alt="">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
